{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">CITIZEN PORTAL</span><h2 class="fw-bold">Submit a complaint</h2><p class="text-secondary">Share enough detail for the responsible team to investigate.</p></div><div class="form-card"><form method="post"><label class="form-label">Complaint title</label><input class="form-control mb-3" name="title" minlength="5" maxlength="180" required placeholder="A short summary of the issue"><label class="form-label">Responsible department / complaint category</label><select class="form-select mb-3" name="department" required><option value="">Choose complaint category</option>{% for d in departments %}<option value="{{ d }}">{{ d }}</option>{% endfor %}</select><label class="form-label">Complaint details</label><textarea class="form-control mb-3" name="description" rows="7" minlength="20" required placeholder="What happened, when did it happen, and what outcome are you requesting?"></textarea><div class="alert alert-info small">Choose the category that best matches your issue. AI category and sentiment are suggestions; staff can review and correct them.</div><button class="btn btn-primary">Submit complaint</button></form></div>{% endblock %}
